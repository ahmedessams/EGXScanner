# Render Blueprint for the EGX N8N Scanner.
#
# This file MUST live at the git repo root — Render's Blueprint scanner does
# not look in subdirectories. The actual project lives in ./egx-n8n-scanner
# (see `rootDir` on each service below, which points Render's build context
# there — Dockerfile*, sql/, data/, webapp/ etc. all stay where they are).
#
# Usage: push this repo to GitHub, then in Render: New -> Blueprint -> pick
# the repo -> Apply.
#
# After the first deploy finishes, manual one-time steps remain — see
# egx-n8n-scanner/docs/RENDER_DEPLOY.md for the full walkthrough:
#   1. Go to the "egx-db-init" cron job and click "Trigger Run" ONCE to
#      restore data/full_dump.sql.gz (schema + ~10 months of real EGX data
#      already imported) into the fresh database. Idempotent — safe to
#      trigger again later, it just no-ops if the schema already exists.
#   2. Open the n8n URL, create the owner account, and add ONE Postgres
#      credential pointing at "egx-postgres" (Render's dashboard shows the
#      individual host/port/user/password/database values on the database's
#      Info tab).
#   3. Import all 15 workflows/*.json files and assign that Postgres
#      credential to every Postgres node (deliberately not pre-wired — see
#      docs/IMPORT-N8N.md "Why credentials can't ship pre-wired").
#   4. Publish workflows 01, 03-11 (dependency order), then 12, 13, 14, 15,
#      and fill in MARKET_API_BASE_URL / MARKET_API_KEY (EODHD) as real
#      secrets in the egx-n8n service's Environment tab — they ship unset
#      here since they're credentials, never committed to git.

databases:
  - name: egx-postgres
    databaseName: egx_scanner
    user: egx_user
    # Render retired legacy Postgres instance types (starter/standard/pro)
    # for new databases — basic-256mb is the current smallest persistent
    # paid tier (comfortably enough for this dataset: ~47MB uncompressed).
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"

services:
  # --- egx-n8n: workflow engine, hosts the 15 EGX scanner workflows -------
  # Uses the stock n8n image directly (unmodified — it's a "hardened" Alpine
  # build with no package manager, so it can't be customized in-place).
  # N8N_HOST/WEBHOOK_URL are hardcoded to this service's predictable
  # onrender.com URL (Render's default domain is always
  # https://<service-name>.onrender.com) — if you rename the service or
  # attach a custom domain, update these two values to match.
  - type: web
    name: egx-n8n
    runtime: image
    image:
      url: docker.io/n8nio/n8n:latest
    # starter (512MB RAM) crashes n8n with "JavaScript heap out of memory"
    # under this project's real load — n8n itself + its Task Runner + the
    # scanner workflows looping indicator/support-resistance computation
    # across 241 stocks needs more headroom. standard (2GB RAM) confirmed
    # via a live deploy crash log.
    plan: standard
    region: frankfurt
    healthCheckPath: /healthz
    disk:
      name: egx-n8n-data
      mountPath: /home/node/.n8n
      sizeGB: 2
    envVars:
      - key: TZ
        value: Africa/Cairo
      - key: GENERIC_TIMEZONE
        value: Africa/Cairo
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_HOST
        value: egx-n8n.onrender.com
      - key: WEBHOOK_URL
        value: https://egx-n8n.onrender.com/
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        generateValue: true
      - key: N8N_BLOCK_ENV_ACCESS_IN_NODE
        value: "false"

      # --- managed Postgres connection details, for the manual credential
      #     setup step (n8n's Postgres credential can't read env vars).
      - key: DATABASE_URL
        fromDatabase: { name: egx-postgres, property: connectionString }
      - key: POSTGRES_HOST
        fromDatabase: { name: egx-postgres, property: host }
      - key: POSTGRES_PORT
        fromDatabase: { name: egx-postgres, property: port }
      - key: POSTGRES_DB
        fromDatabase: { name: egx-postgres, property: database }
      - key: POSTGRES_USER
        fromDatabase: { name: egx-postgres, property: user }
      - key: POSTGRES_PASSWORD
        fromDatabase: { name: egx-postgres, property: password }

      # --- market data provider (EODHD) — real secrets, fill in manually
      #     in the Render dashboard after the Blueprint is created.
      - key: MARKET_DATA_PROVIDER
        value: eodhd
      - key: MARKET_API_BASE_URL
        sync: false
      - key: MARKET_API_KEY
        sync: false
      - key: EGX_EXCHANGE_CODE
        value: EGX

      # --- AI Assessment (17-egx-ai-assessment) — optional. Real secret,
      #     fill in manually. If left unset, that workflow just no-ops
      #     (every AI column stays NULL) rather than failing anything.
      - key: ANTHROPIC_API_KEY
        sync: false

      # --- import / liquidity / scoring config (mirrors env.example.txt) --
      - key: HISTORICAL_DAYS
        value: "750"
      - key: API_BATCH_SIZE
        value: "10"
      - key: API_DELAY_MS
        value: "500"
      - key: MIN_AVG_TRADED_VALUE
        value: "500000"
      - key: MIN_AVG_VOLUME
        value: "50000"
      - key: MIN_ACTIVE_DAYS_20
        value: "15"
      - key: DAILY_SCAN_HOUR
        value: "21"
      - key: DAILY_SCAN_MINUTE
        value: "0"
      - key: TOP_N
        value: "10"
      - key: BREAKOUT_MIN_RVOL
        value: "1.5"
      - key: BREAKOUT_STRONG_RVOL
        value: "2"
      - key: BREAKOUT_DISTANCE_PCT
        value: "1.5"
      - key: SUPPORT_RESISTANCE_LOOKBACK
        value: "150"

      # --- Report API auth (webapp Settings -> Bearer token) --------------
      - key: REPORT_WEBHOOK_SECRET
        generateValue: true

  # --- egx-db-init: one-shot job, restores data/full_dump.sql.gz ----------
  # Cron jobs don't auto-run on deploy — go to this service in Render and
  # click "Trigger Run" once after the first deploy. The `schedule` below is
  # a once-a-year placeholder (real invocation is the manual trigger); it
  # won't fire on its own in any practical sense.
  - type: cron
    name: egx-db-init
    runtime: docker
    rootDir: egx-n8n-scanner
    dockerfilePath: ./Dockerfile.dbinit
    dockerContext: .
    schedule: "0 0 1 1 *"
    plan: starter
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: egx-postgres, property: connectionString }

  # --- egx-webapp: static dashboard over the Report API --------------------
  - type: web
    name: egx-webapp
    runtime: static
    rootDir: egx-n8n-scanner
    staticPublishPath: ./webapp
    buildCommand: >-
      sed -i "s#__N8N_BASE_URL__#${N8N_BASE_URL}/webhook/egx#g" webapp/index.html
    envVars:
      - key: N8N_BASE_URL
        value: https://egx-n8n.onrender.com
