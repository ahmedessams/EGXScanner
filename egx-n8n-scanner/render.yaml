# Render Blueprint for the EGX N8N Scanner.
#
# Usage: push this repo to GitHub, then in Render: New -> Blueprint, pick the
# repo. If this "egx-n8n-scanner" folder is NOT your repo root, set the
# Blueprint's Root Directory to "egx-n8n-scanner" when Render asks.
#
# After the first deploy still finishes, three MANUAL one-time steps remain
# (same as local docker-compose — see docs/IMPORT-N8N.md and README.md):
#   1. Open the n8n URL, create the owner account, and add ONE Postgres
#      credential pointing at the "egx-postgres" database (Render's dashboard
#      shows the individual host/port/user/password/database values on the
#      database's Info tab).
#   2. Import all 15 workflows/*.json files and assign that Postgres
#      credential to every Postgres node (deliberately not pre-wired — see
#      docs/IMPORT-N8N.md "Why credentials can't ship pre-wired").
#   3. Publish workflows 01, 03-11 (dependency order), then 12, 13, 14, 15,
#      and fill in MARKET_API_BASE_URL / MARKET_API_KEY (EODHD) as real
#      secrets in the egx-n8n service's Environment tab in Render — they ship
#      unset here since they're credentials, never committed to git.
#
# Data: this Blueprint restores data/full_dump.sql.gz (schema + ~10 months of
# real EGX price/scan history already imported) into a FRESH Postgres on
# first deploy only — see scripts/render-db-init.sh. Later deploys are a fast
# no-op check, not a re-import.

databases:
  - name: egx-postgres
    databaseName: egx_scanner
    user: egx_user
    plan: starter
    region: frankfurt
    postgresMajorVersion: "16"

services:
  # --- n8n: workflow engine, hosts the 15 EGX scanner workflows -----------
  - type: web
    name: egx-n8n
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile.n8n
    dockerContext: .
    healthCheckPath: /healthz
    preDeployCommand: sh /home/node/render-db-init.sh
    startCommand: >-
      sh -c 'export N8N_PROTOCOL=https;
      export N8N_HOST=$(echo $RENDER_EXTERNAL_URL | sed -E "s#https?://##; s#/*$##");
      export WEBHOOK_URL=$RENDER_EXTERNAL_URL/;
      n8n start'
    disk:
      name: egx-n8n-data
      mountPath: /home/node/.n8n
      sizeGB: 2
    envVars:
      - key: TZ
        value: Africa/Cairo
      - key: GENERIC_TIMEZONE
        value: Africa/Cairo
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        generateValue: true
      - key: N8N_BLOCK_ENV_ACCESS_IN_NODE
        value: "false"

      # --- managed Postgres connection details, for the manual credential
      #     setup step (n8n's Postgres credential can't read env vars).
      - key: DATABASE_URL
        fromDatabase: { name: egx-postgres, property: connectionString }
      - key: POSTGRES_HOST
        fromDatabase: { name: egx-postgres, property: host }
      - key: POSTGRES_PORT
        fromDatabase: { name: egx-postgres, property: port }
      - key: POSTGRES_DB
        fromDatabase: { name: egx-postgres, property: database }
      - key: POSTGRES_USER
        fromDatabase: { name: egx-postgres, property: user }
      - key: POSTGRES_PASSWORD
        fromDatabase: { name: egx-postgres, property: password }

      # --- market data provider (EODHD) — real secrets, fill in manually
      #     in the Render dashboard after the Blueprint is created.
      - key: MARKET_DATA_PROVIDER
        value: eodhd
      - key: MARKET_API_BASE_URL
        sync: false
      - key: MARKET_API_KEY
        sync: false
      - key: EGX_EXCHANGE_CODE
        value: EGX

      # --- import / liquidity / scoring config (mirrors env.example.txt) --
      - key: HISTORICAL_DAYS
        value: "750"
      - key: API_BATCH_SIZE
        value: "10"
      - key: API_DELAY_MS
        value: "500"
      - key: MIN_AVG_TRADED_VALUE
        value: "500000"
      - key: MIN_AVG_VOLUME
        value: "50000"
      - key: MIN_ACTIVE_DAYS_20
        value: "15"
      - key: DAILY_SCAN_HOUR
        value: "21"
      - key: DAILY_SCAN_MINUTE
        value: "0"
      - key: TOP_N
        value: "10"
      - key: BREAKOUT_MIN_RVOL
        value: "1.5"
      - key: BREAKOUT_STRONG_RVOL
        value: "2"
      - key: BREAKOUT_DISTANCE_PCT
        value: "1.5"
      - key: SUPPORT_RESISTANCE_LOOKBACK
        value: "150"

      # --- Report API auth (webapp Settings -> Bearer token) --------------
      - key: REPORT_WEBHOOK_SECRET
        generateValue: true

  # --- webapp: static dashboard over the Report API ------------------------
  - type: web
    name: egx-webapp
    runtime: static
    staticPublishPath: ./webapp
    buildCommand: >-
      sed -i "s#__N8N_BASE_URL__#${N8N_BASE_URL}/webhook/egx#g" webapp/index.html
    envVars:
      - key: N8N_BASE_URL
        fromService: { name: egx-n8n, type: web, envVarKey: RENDER_EXTERNAL_URL }
